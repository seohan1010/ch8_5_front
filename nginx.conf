server {
    listen 3000;
    server_name _;

    # HTML 파일들이 위치한 디렉터리 (예: /usr/share/nginx/html)
    root /usr/share/nginx/html;
    index index.html;

    # 모든 요청을 특정 html 파일로 전달 (예: index.html)
    location / {
        try_files $uri /index.html;
    }

    # MIME 타입 설정
    types {
        text/html html;
    }

    # 로그 설정 (선택)
    access_log /var/log/nginx/app_access.log;
    error_log /var/log/nginx/app_error.log;
}

